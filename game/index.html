<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLASH GAME · ゲーム — 주먹 쥔 손으로 쓰다듬지 못해서</title>
<meta name="description" content="『주먹 쥔 손으로 쓰다듬지 못해서』 게임 — 심리테스트, 읽지 않음.">
<meta name="theme-color" content="#7f9aa6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+JP:wght@500;900&family=Noto+Sans+KR:wght@900&family=DotGothic16&display=swap">
<link rel="stylesheet" href="../hub.css">
<style>
html,body{height:100%;margin:0;background:#86a1ad;overflow:hidden}
.desk{position:absolute;background:url(../img/hub/game.jpg) center/100% 100% no-repeat}
.crt{position:absolute;left:39.6%;top:17.6%;width:27%;height:34.6%;border-radius:2.2% / 3%;overflow:hidden;background:#0d1a17;color:#d7ffe8;font-family:"DotGothic16",var(--jp);padding:4% 5%;display:flex;flex-direction:column;gap:3%;font-size:clamp(9px,1.1vw,20px);line-height:1.25;text-shadow:0 0 6px rgba(140,255,200,.55)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55));}
.crt h1{margin:0;font-family:var(--wide);font-weight:900;font-stretch:62%;font-size:2.3em;line-height:.9;color:var(--y);letter-spacing:.02em;text-shadow:0 0 8px rgba(255,229,0,.5)}
.crt .sub{color:#8fe3b8}
.crt ul{list-style:none;margin:2% 0 0;padding:0;display:flex;flex-direction:column;gap:.35em}
.crt a{color:inherit;text-decoration:none;display:flex;gap:.6em;padding:.1em .3em}
.crt a::before{content:"  ";white-space:pre;width:1em}
.crt a.on{background:#d7ffe8;color:#0d1a17;text-shadow:none}
.crt a.on::before{content:"▶"}
.crt .ins{margin-top:auto;color:var(--y)}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.tickets{position:fixed;right:clamp(10px,3vw,40px);bottom:clamp(10px,4vh,40px);z-index:20;display:flex;gap:14px;align-items:flex-end}
.tk{position:relative;display:block;width:clamp(180px,20vw,280px);aspect-ratio:1.6;background:#f7f6f1;border-radius:10px;box-shadow:0 18px 22px -8px rgba(0,0,0,.55);color:var(--k);text-decoration:none;overflow:hidden;font-family:"DotGothic16",var(--jp);transition:transform .25s}
.tk:nth-child(1){transform:rotate(-12deg) translateY(6px)}
.tk:nth-child(2){transform:rotate(7deg)}
.tk:hover{transform:rotate(0) translateY(-10px)}
.tk .blk{position:absolute;left:5%;top:24%;width:66%;height:30%;background:var(--b);clip-path:polygon(0 100%,10% 0,38% 0,50% 45%,62% 0,100% 0,100% 100%)}
.tk .bars{position:absolute;right:5%;top:8%;width:28%;height:46%;background:repeating-linear-gradient(90deg,var(--b) 0 5px,transparent 5px 9px)}
.tk .top{position:absolute;left:6%;top:9%;font-family:var(--wide);font-weight:900;font-stretch:62%;font-size:clamp(9px,.9vw,13px);letter-spacing:.06em;transform:rotate(-7deg);transform-origin:0 0}
.tk .no{position:absolute;left:6%;top:59%;font-size:clamp(11px,1.15vw,16px);line-height:1.2}
.tk .nm{position:absolute;right:6%;top:59%;text-align:right;font-size:clamp(11px,1.15vw,16px);line-height:1.2}
.tk.go{transition:transform .7s cubic-bezier(.6,0,.4,1),opacity .7s;opacity:0}
.sign{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:30;display:flex;box-shadow:6px 6px 0 rgba(0,0,0,.35);white-space:nowrap}
.sign .en{background:var(--b);color:#fff;font-family:var(--wide);font-weight:900;font-stretch:62%;font-size:clamp(22px,3.2vw,44px);line-height:1;padding:.12em .3em}
.sign .jp{background:var(--y);color:var(--k);font-family:var(--jp);font-weight:900;font-size:clamp(14px,1.8vw,24px);padding:.25em .35em;display:flex;align-items:center}
@media (max-width:700px){.sign{left:auto;right:12px;transform:none}.tickets{left:50%;right:auto;transform:translateX(-50%)}.tk{width:44vw}}
</style>
</head>
<body>
<a class="back" href="../">← 遇當路 HOME</a>
<div class="sign" aria-hidden="true"><span class="en">FLASH GAME</span><span class="jp">ゲーム</span></div>
<div class="desk" id="desk">
  <div class="crt" role="navigation" aria-label="게임 선택">
    <h1>SELECT GAME</h1>
    <div class="sub">ゲームを選んでください · 遊戲選擇</div>
    <ul id="menu">
      <li><a href="../test/" class="on">01 心理テスト — LOVE TEST</a></li>
      <li><a href="../unread/">02 未讀 — UNREAD</a></li>
    </ul>
    <div class="ins">INSERT TICKET <span class="blink">■</span></div>
  </div>
</div>
<div class="tickets">
  <a class="tk" href="../test/" aria-label="심리테스트">
    <span class="top">THE CLENCHED HAND GENERATION</span><span class="blk"></span><span class="bars"></span>
    <span class="no">GAME 01<br>シンリテスト<br>1113-2026</span><span class="nm">心理<br>テスト<br>¥0</span>
  </a>
  <a class="tk" href="../unread/" aria-label="읽지 않음">
    <span class="top">THE CLENCHED HAND GENERATION</span><span class="blk"></span><span class="bars"></span>
    <span class="no">GAME 02<br>ミドク<br>1113-2026</span><span class="nm">未讀<br>UNREAD<br>¥0</span>
  </a>
</div>
<script>
(() => {
  const AR = 2400 / 1435, SX = .531, SY = .35;
  const desk = document.getElementById('desk');
  function place() {
    const vw = innerWidth, vh = innerHeight;
    let W = Math.max(vw, vh * AR);
    if (W * .36 > vw) W = vw / .36;
    const H = W / AR;
    const left = Math.min(0, Math.max(vw - W, vw / 2 - W * SX));
    const top = H >= vh ? Math.min(0, Math.max(vh - H, vh * .42 - H * SY)) : (vh - H) / 2;
    Object.assign(desk.style, { width: W + 'px', height: H + 'px', left: left + 'px', top: top + 'px' });
  }
  place(); addEventListener('resize', place);

  const items = [...document.querySelectorAll('#menu a')];
  let k = 0;
  const sel = i => { k = (i + items.length) % items.length; items.forEach((a, j) => a.classList.toggle('on', j === k)); };
  items.forEach((a, i) => a.addEventListener('mouseenter', () => sel(i)));
  addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel(k + 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel(k - 1); e.preventDefault(); }
    else if (e.key === 'Enter' && !e.target.closest('a')) location.href = items[k].href;
  });

  // 티켓을 누르면 모니터 속으로 들어간 뒤 이동
  const crt = document.querySelector('.crt');
  document.querySelectorAll('.tk').forEach(t => t.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    e.preventDefault();
    const a = t.getBoundingClientRect(), b = crt.getBoundingClientRect();
    const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
    t.classList.add('go'); t.style.transform = `translate(${dx}px, ${dy}px) scale(.2)`;
    setTimeout(() => location.href = t.href, 650);
  }));
})();
</script>
</body>
</html>
