html,body{height:100%}
body{background:var(--k);overflow-x:hidden}

.b3 .buy nav a{color:#fff;text-decoration:none;border-bottom:2px solid transparent}
.b3 .buy nav a:hover{border-color:var(--y);color:var(--y)}
.band,.who,.listen,.game,.strip{position:relative;min-height:0}
.who,.listen,.game,.strip{overflow:hidden}
.band>.fit,.who>.fit,.listen>.fit,.game>.fit,.strip>.fit{position:absolute;left:var(--px,.6vw);top:var(--pt,1.4vh);width:calc(100% - 2 * var(--px,.6vw));height:calc(100% - var(--pt,1.4vh) - var(--pb,1vh))}
.strip{--px:.4vw;--pt:.6vh;--pb:.4vh}
a.go{transition:filter .15s}
a.go:hover{filter:brightness(1.12)}
a.go:hover .fit text{fill:var(--r)}
.R.go:hover .big{color:var(--y)}
.music{position:absolute;left:.5vw;top:.7vh;z-index:3;max-width:15vw;flex-wrap:wrap;font-family:var(--wide);font-stretch:62%;font-weight:900;font-size:12px;letter-spacing:.04em;color:var(--y);background:var(--k);padding:.25em .5em;display:flex;gap:.2em .8em}

.music button:hover{color:#fff}

  .music{position:relative;left:auto;top:auto;max-width:none;grid-column:1/-1;justify-self:end;margin:3vw;font-size:13px}
